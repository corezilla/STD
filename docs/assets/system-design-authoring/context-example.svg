<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="690" viewBox="0 0 1260 690" role="img" aria-labelledby="title desc">
  <title id="title">FIG-EX-01 团队报告生成服务：应用上下文教学示例</title>
  <desc id="desc">虚构目标设计。员工通过已有客户端提交资料并查询报告，IT 管理者通过管理接口维护报告服务。外部系统与本产品责任分开，实线表示业务交接，点线表示管理交接；不是物理部署或已实现协议。</desc>
  <defs>
    <marker id="dataArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#285f96"/></marker>
    <marker id="controlArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#687481"/></marker>
    <style>
      text { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #203348; }
      .heading { font-size: 29px; font-weight: 600; }
      .label { font-size: 24px; font-weight: 600; }
      .small { font-size: 21px; }
      .sub { font-size: 20px; fill: #506176; }
      .edge { stroke: #285f96; stroke-width: 3; fill: none; }
      .control { stroke: #687481; stroke-width: 3; stroke-dasharray: 3 7; fill: none; }
    </style>
  </defs>
  <rect width="1260" height="690" rx="16" fill="#fafcfe"/>
  <text x="38" y="49" class="heading">先画“谁在使用、系统在哪里”，再展开内部模块</text>
  <text x="38" y="85" class="sub">FIG-EX-01 · EX-RPT-01 · 原创虚构示例 · Target / Planned / NOT_RUN</text>

  <rect x="40" y="145" width="210" height="115" rx="12" fill="#f0f3f6" stroke="#8a99a9" stroke-width="2"/>
  <text x="145" y="184" text-anchor="middle" class="label">员工 / 操作员</text>
  <text x="145" y="216" text-anchor="middle" class="small">选择资料、查看结果</text>
  <text x="145" y="243" text-anchor="middle" class="sub">外部：业务侧</text>

  <rect x="345" y="145" width="230" height="115" rx="12" fill="#f0f3f6" stroke="#8a99a9" stroke-width="2"/>
  <text x="460" y="184" text-anchor="middle" class="label">已有客户端</text>
  <text x="460" y="216" text-anchor="middle" class="small">提交资料、查询任务</text>
  <text x="460" y="243" text-anchor="middle" class="sub">外部：业务侧</text>

  <rect x="850" y="130" width="370" height="375" rx="16" fill="#eaf4ff" stroke="#285f96" stroke-width="3"/>
  <text x="1035" y="180" text-anchor="middle" class="label">报告生成服务 [Target]</text>
  <text x="1035" y="216" text-anchor="middle" class="small">本产品的责任边界</text>
  <line x1="880" y1="237" x2="1190" y2="237" stroke="#aac8e4"/>
  <text x="1035" y="281" text-anchor="middle" class="small">接收固定输入、管理任务</text>
  <text x="1035" y="320" text-anchor="middle" class="small">生成并发布完整报告</text>
  <text x="1035" y="359" text-anchor="middle" class="small">提供可查询的状态与结果</text>
  <text x="1035" y="417" text-anchor="middle" class="sub">不修改外部源资料</text>
  <text x="1035" y="454" text-anchor="middle" class="sub">Owner: Report Service</text>

  <path d="M250 185 H345" class="edge" marker-end="url(#dataArrow)"/>
  <text x="298" y="173" text-anchor="middle" class="sub">操作</text>
  <path d="M345 230 H250" class="edge" marker-end="url(#dataArrow)"/>
  <path d="M575 182 H850" class="edge" marker-end="url(#dataArrow)"/>
  <text x="713" y="152" text-anchor="middle" class="small">IF-EX-SUBMIT</text>
  <text x="713" y="212" text-anchor="middle" class="sub">输入引用 + 请求标识</text>

  <path d="M490 260 V302 H850" class="edge" marker-end="url(#dataArrow)"/>
  <text x="676" y="286" text-anchor="middle" class="small">IF-EX-QUERY 查询</text>
  <path d="M850 370 H415 V260" class="edge" marker-end="url(#dataArrow)"/>
  <text x="651" y="353" text-anchor="middle" class="small">IF-EX-RESULT 状态 / 报告</text>

  <rect x="40" y="423" width="285" height="112" rx="12" fill="#f0f3f6" stroke="#8a99a9" stroke-width="2"/>
  <text x="182" y="462" text-anchor="middle" class="label">IT 管理者</text>
  <text x="182" y="494" text-anchor="middle" class="small">外部：运行维护责任</text>
  <path d="M325 477 H850" class="control" marker-start="url(#controlArrow)" marker-end="url(#controlArrow)"/>
  <text x="587" y="458" text-anchor="middle" class="small">IF-EX-MGMT 管理 / 状态</text>

  <line x1="40" y1="573" x2="1220" y2="573" stroke="#ced9e3"/>
  <path d="M45 610 H105" class="edge" marker-end="url(#dataArrow)"/>
  <text x="121" y="617" class="small">业务交接</text>
  <path d="M290 610 H350" class="control" marker-end="url(#controlArrow)"/>
  <text x="366" y="617" class="small">管理交接</text>
  <text x="600" y="617" class="small">蓝框：产品范围；灰框：外部责任</text>
  <text x="40" y="657" class="sub">单节点内网的逻辑关系；接口 ID 为教学标识、实际协议未定。非物理组网图，不表示已实现能力。</text>
</svg>
