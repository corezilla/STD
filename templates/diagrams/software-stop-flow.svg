<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">停止与重新启动 · 先确认旧进程退出</title><desc id="desc">停止期限由部署约定固定；超时不是已停止。读请求可能中断，但不存在写入回滚。</desc>
<defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20344b}.heading{font-size:30px;font-weight:650}.label{font-size:22px;font-weight:550}.note{font-size:18px;fill:#53667b}</style>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#287bc1"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a06643"/></marker></defs>
<rect width="1200" height="780" rx="18" fill="white"/>
<text x="40" y="48" class="heading" text-anchor="start">停止与重新启动 · 先确认旧进程退出</text>
<text x="40" y="83" class="note" text-anchor="start">EX-SEARCH/v1 · Target / Planned / NOT_RUN · 虚构教学</text>
<g id="t1"><rect x="75" y="165" width="330" height="85" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="240" y="201.5" class="label" text-anchor="middle">T1 入口模块</text>
<text x="240" y="230.5" class="label" text-anchor="middle">关闭监听，拒绝新查询</text></g><g id="t2"><rect x="75" y="340" width="330" height="100" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="240" y="370" class="label" text-anchor="middle">T2 查询处理</text>
<text x="240" y="399" class="label" text-anchor="middle">请求取消在途只读计算</text>
<text x="240" y="428" class="label" text-anchor="middle">等待处理退出</text></g><g id="t3"><rect x="75" y="540" width="330" height="85" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="240" y="590.5" class="label" text-anchor="middle">T3 释放内存表并退出</text></g><g id="force"><rect x="785" y="325" width="330" height="115" rx="14" fill="#fff0e8" stroke="#9eb5cb"/><text x="950" y="362.5" class="label" text-anchor="middle">等待超时：部署者终止进程</text>
<text x="950" y="391.5" class="label" text-anchor="middle">未确认退出：报告阻塞</text>
<text x="950" y="420.5" class="label" text-anchor="middle">禁止启动第二份进程</text></g><g id="confirm"><rect x="785" y="530" width="330" height="85" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="950" y="580.5" class="label" text-anchor="middle">T4 部署者确认进程退出</text></g><g id="restart"><rect x="470" y="635" width="285" height="62" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="612.5" y="674" class="label" text-anchor="middle">需要重启：进入 P-START</text></g><path d="M240 250 V340" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="363" y="294" class="note" text-anchor="middle">在途连接允许结束</text><path d="M240 440 V540" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="330" y="496" class="note" text-anchor="middle">处理全部退出</text><path d="M405 580 H785" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="600" y="560" class="note" text-anchor="middle">退出状态</text><path d="M405 390 H785" fill="none" stroke="#a06643" stroke-width="2.8" marker-end="url(#orange)"/><text x="590" y="371" class="note" text-anchor="middle">期限内未结束</text><path d="M950 440 V530" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="1030" y="490" class="note" text-anchor="middle">取得退出确认</text><path d="M950 615 V666 H755" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/>
<text x="40" y="726" class="note" text-anchor="start">蓝线：正常交接或执行顺序　棕线：失败 / 退出　文字说明条件，不以颜色代替语义</text>
<text x="40" y="757" class="note" text-anchor="start">停止期限由部署约定固定；超时不是已停止。读请求可能中断，但不存在写入回滚。</text>
</svg>
