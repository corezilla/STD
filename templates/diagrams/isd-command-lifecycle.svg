<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600" role="img" aria-labelledby="title desc">
 <title id="title">有状态提交过程及失败出口</title><desc id="desc">提交请求先验证，再检查 request_id。已有请求只返回原状态；新请求写入 PENDING，执行并提交成功、失败或未知结果；响应丢失时查询权威记录。</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#4676a8"/></marker></defs>
 <style>text{font-family:system-ui,'PingFang SC',sans-serif;fill:#20344b}.head{font-size:22px;font-weight:600}.body{font-size:16px}.note{font-size:14px;fill:#54708b}.edge{fill:none;stroke:#4676a8;stroke-width:2.5;marker-end:url(#arrow)}</style>
 <rect width="1300" height="600" fill="#fff"/><text x="30" y="40" class="head">示例 · 有状态命令从提交到收口</text>
 <rect x="30" y="85" width="245" height="62" rx="10" fill="#e9f2fb" stroke="#8eabc8"/><text x="152" y="113" text-anchor="middle" class="body">submit(request_id, payload)</text><text x="152" y="136" text-anchor="middle" class="note">CMD-001</text>
 <rect x="345" y="85" width="245" height="62" rx="10" fill="#dceafb" stroke="#8eabc8"/><text x="467" y="113" text-anchor="middle" class="body">校验输入、权限、期限</text>
 <rect x="670" y="60" width="570" height="62" rx="10" fill="#f8eaea" stroke="#d4a6a6"/><text x="955" y="96" text-anchor="middle" class="body">拒绝：ERR-INPUT / ERR-AUTH；无持久副作用</text>
 <rect x="345" y="195" width="245" height="62" rx="10" fill="#dceafb" stroke="#8eabc8"/><text x="467" y="233" text-anchor="middle" class="body">request_id 已存在？</text>
 <rect x="670" y="165" width="570" height="62" rx="10" fill="#f2f6fa" stroke="#aab9c7"/><text x="955" y="202" text-anchor="middle" class="body">已完成或执行中：返回原结果 / ACCEPTED，不新增执行</text>
 <rect x="345" y="310" width="245" height="62" rx="10" fill="#e6f4ed" stroke="#8ab8a0"/><text x="467" y="339" text-anchor="middle" class="body">事务写入 CommandRecord</text><text x="467" y="361" text-anchor="middle" class="note">PENDING · 持久提交点</text>
 <rect x="670" y="310" width="245" height="62" rx="10" fill="#dceafb" stroke="#8eabc8"/><text x="792" y="347" text-anchor="middle" class="body">执行副作用并记录结果</text>
 <rect x="30" y="455" width="320" height="72" rx="10" fill="#e6f4ed" stroke="#8ab8a0"/><text x="190" y="486" text-anchor="middle" class="body">SUCCEEDED · ResultRecord</text><text x="190" y="510" text-anchor="middle" class="note">响应送达 → 返回结果</text>
 <rect x="395" y="455" width="320" height="72" rx="10" fill="#f8eaea" stroke="#d4a6a6"/><text x="555" y="486" text-anchor="middle" class="body">FAILED · ErrorPayload</text><text x="555" y="510" text-anchor="middle" class="note">返回稳定 error_code / details</text>
 <rect x="760" y="455" width="480" height="72" rx="10" fill="#f5f0e6" stroke="#c9b990"/><text x="1000" y="486" text-anchor="middle" class="body">UNKNOWN 或成功但响应丢失</text><text x="1000" y="510" text-anchor="middle" class="note">query(request_id) 读取权威状态；禁止直接新业务重试</text>
 <path class="edge" d="M275 116 H345"/><path class="edge" d="M590 104 H670"/><text x="611" y="92" class="note">无效</text>
 <path class="edge" d="M467 147 V195"/><text x="480" y="177" class="note">有效</text>
 <path class="edge" d="M590 226 H670"/><text x="611" y="214" class="note">存在</text>
 <path class="edge" d="M467 257 V310"/><text x="480" y="290" class="note">不存在</text>
 <path class="edge" d="M590 341 H670"/>
 <path class="edge" d="M740 372 C740 410 190 410 190 455"/><text x="320" y="402" class="note">成功</text>
 <path class="edge" d="M792 372 C792 420 555 420 555 455"/><text x="650" y="409" class="note">确定失败</text>
 <path class="edge" d="M845 372 C845 417 1000 417 1000 455"/><text x="925" y="405" class="note">未知 / 响应丢失</text>
 <text x="30" y="574" class="note">图例只展示关键分支；项目须以自身函数、数据结构、错误码及验证项落实每一出口。</text>
</svg>
