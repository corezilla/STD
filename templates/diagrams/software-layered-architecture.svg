<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="720" viewBox="0 0 1344 720" role="img" aria-labelledby="title description">
  <title id="title">工控机主机软件——分层组成示例</title>
  <desc id="description">虚构教学示例 EX-SW-01，Target、Planned、NOT_RUN。应用层包含操作界面、检测流程和图像分析；驱动层包含驱动 API、设备管理、采集控制、图像交付和状态读取。系统定制层为条件式示意，仅在项目实际定制或改造操作系统时保留，并替换为具体名称；不是本采集案例已确定的组成。普通操作系统不作为本图模块。仅表示组成与层次，不表示调用、执行顺序或部署边界。</desc>
  <defs>
    <!-- 共用样式：颜色、字体和边界在这里修改；几何尺寸在各分组中修改。 -->
    <style>
      text { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #14263f; }
      .diagram-title { font-size: 34px; font-weight: 600; }
      .diagram-status { font-size: 16px; fill: #52657d; text-anchor: end; }
      .layer-label { font-size: 26px; font-weight: 600; text-anchor: end; }
      .module-label { font-size: 25px; font-weight: 500; text-anchor: middle; }
      .layer-panel { stroke-width: 1.5; }
      .module { stroke-width: 1.25; filter: url(#card-shadow); }
      .neutral .layer-panel { fill: #f1f5f9; stroke: #b7c4d4; }
      .neutral .module { fill: #d4dfe9; stroke: #a4b5c8; }
      .accent .layer-panel { fill: #edf5ff; stroke: #9fc6f4; }
      .accent .module { fill: #a8ccf4; stroke: #74a9e4; }
      .accent .interface { fill: #d0e4fb; stroke: #8fbbed; }
    </style>
    <filter id="card-shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#243f60" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1344" height="720" fill="#ffffff"/>
  <text class="diagram-title" x="224" y="67">工控机主机软件</text>
  <text class="diagram-status" x="1304" y="65">Target · Planned · NOT_RUN</text>

  <!-- 复制整个 layer 分组可增加一层。左侧标签与右侧面板一起移动。 -->
  <g id="application-layer" class="neutral" transform="translate(0 104)">
    <text class="layer-label" x="184" y="90">应用层</text>
    <g id="customer-application">
      <rect class="layer-panel" x="224" width="1080" height="162" rx="14"/>
      <!-- 模块只用文字；一行三个模块，宽 328、间隔 24。 -->
      <g id="operator-interface" transform="translate(248 26)">
        <rect class="module" width="328" height="110" rx="10"/>
        <text class="module-label" x="164" y="64">操作界面</text>
      </g>
      <g id="inspection-workflow" transform="translate(600 26)">
        <rect class="module" width="328" height="110" rx="10"/>
        <text class="module-label" x="164" y="64">检测流程</text>
      </g>
      <g id="image-analysis" transform="translate(952 26)">
        <rect class="module" width="328" height="110" rx="10"/>
        <text class="module-label" x="164" y="64">图像分析</text>
      </g>
    </g>
  </g>

  <g id="driver-layer" class="accent" transform="translate(0 288)">
    <text class="layer-label" x="184" y="138">驱动层</text>
    <g id="product-driver">
      <rect class="layer-panel" x="224" width="1080" height="258" rx="14"/>
      <!-- 横向接口条属于本层，不是独立层或独立服务。无需时删除本组并上移模块。 -->
      <g id="driver-api" transform="translate(248 24)">
        <rect class="module interface" width="1032" height="66" rx="10"/>
        <text class="module-label" x="516" y="42">驱动 API</text>
      </g>
      <!-- 一行四个模块，宽 240、间隔 24。复制时修改 id 与 transform。 -->
      <g id="device-management" transform="translate(248 112)">
        <rect class="module" width="240" height="118" rx="10"/>
        <text class="module-label" x="120" y="68">设备管理</text>
      </g>
      <g id="acquisition-control" transform="translate(512 112)">
        <rect class="module" width="240" height="118" rx="10"/>
        <text class="module-label" x="120" y="68">采集控制</text>
      </g>
      <g id="image-delivery" transform="translate(776 112)">
        <rect class="module" width="240" height="118" rx="10"/>
        <text class="module-label" x="120" y="68">图像交付</text>
      </g>
      <g id="status-readout" transform="translate(1040 112)">
        <rect class="module" width="240" height="118" rx="10"/>
        <text class="module-label" x="120" y="68">状态读取</text>
      </g>
    </g>
  </g>

  <!-- 条件式样板：没有系统定制时删除整个分组，并缩短画布；不能把普通 OS 当成自研模块。 -->
  <g id="system-customization-layer" class="neutral" transform="translate(0 568)">
    <text class="layer-label" x="184" y="66">系统定制层</text>
    <rect class="layer-panel" x="224" width="1080" height="112" rx="14"/>
    <g id="custom-operating-system" transform="translate(248 24)">
      <rect class="module" width="1032" height="64" rx="10"/>
      <text class="module-label" x="516" y="41">定制操作系统（按需）</text>
    </g>
  </g>
</svg>
