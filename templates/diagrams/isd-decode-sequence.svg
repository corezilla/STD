<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
 <title id="title">decode_one 调用时序</title><desc id="desc">Caller 调用 decode_one；短输入直接返回 NEED_MORE。头部完整时调用 read_header，按顺序校验后返回 INVALID、NEED_MORE 或带借用视图的 OK。</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#4676a8"/></marker></defs>
 <style>text{font-family:system-ui,'PingFang SC',sans-serif;fill:#20344b}.head{font-size:22px;font-weight:600}.body{font-size:17px}.note{font-size:15px;fill:#54708b}.life{stroke:#9ab3ca;stroke-dasharray:6 6;stroke-width:2}.edge{stroke:#4676a8;stroke-width:2.5;marker-end:url(#arrow)}</style>
 <rect width="1100" height="440" fill="#fff"/><text x="30" y="40" class="head">EX-ISD/v1 · decode_one 调用时序</text>
 <rect x="45" y="70" width="170" height="54" rx="10" fill="#e9f2fb" stroke="#8eabc8"/><text x="130" y="103" text-anchor="middle" class="body">Caller</text>
 <rect x="425" y="70" width="210" height="54" rx="10" fill="#dceafb" stroke="#8eabc8"/><text x="530" y="103" text-anchor="middle" class="body">decode_one</text>
 <rect x="840" y="70" width="205" height="54" rx="10" fill="#f2f6fa" stroke="#8eabc8"/><text x="943" y="103" text-anchor="middle" class="body">read_header</text>
 <path class="life" d="M130 124 V412 M530 124 V412 M943 124 V412"/>
 <path class="edge" d="M130 157 H530"/><text x="270" y="147" class="note">完整只读 input</text>
 <rect x="240" y="177" width="585" height="55" rx="8" fill="#f7f9fb" stroke="#c4d2df"/><text x="255" y="211" class="body">分支 A：少于 6 字节 → NEED_MORE、consumed=0、无 view</text>
 <path class="edge" d="M530 248 H943"/><text x="635" y="240" class="note">分支 B：头部完整，解码</text>
 <path class="edge" d="M943 280 H530"/><text x="639" y="272" class="note">version / kind / length</text>
 <rect x="382" y="300" width="530" height="50" rx="8" fill="#eaf2fa" stroke="#a9c0d8"/><text x="397" y="332" class="body">按优先级校验字段与 payload 长度</text>
 <path class="edge" d="M530 381 H130"/><text x="188" y="372" class="note">INVALID / NEED_MORE / OK（借用 view），互斥</text>
</svg>
