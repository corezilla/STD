 <rect class="box" x="720" y="76" width="330" height="110" fill="#e6eef5"/><text x="885" y="115" text-anchor="middle" class="body">frame_decoder.h</text><text x="885" y="145" text-anchor="middle" class="note">DecodeResult / FrameView</text>
