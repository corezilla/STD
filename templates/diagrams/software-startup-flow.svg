<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">启动与就绪 · 先取得可用数据，再开放入口</title><desc id="desc">S1–S5 共用冷启动 / 重启入口；W1 为独立监督，不是 F1 的后继步骤。</desc>
<defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20344b}.heading{font-size:30px;font-weight:650}.label{font-size:22px;font-weight:550}.note{font-size:18px;fill:#53667b}</style>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#287bc1"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a06643"/></marker></defs>
<rect width="1200" height="850" rx="18" fill="white"/>
<text x="40" y="48" class="heading" text-anchor="start">启动与就绪 · 先取得可用数据，再开放入口</text>
<text x="40" y="83" class="note" text-anchor="start">EX-SEARCH/v1 · Target / Planned / NOT_RUN · 虚构教学</text>
<g id="s1"><rect x="400" y="130" width="390" height="72" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="595" y="174" class="label" text-anchor="middle">S1 启动协调：校验参数</text></g><g id="s2"><rect x="400" y="255" width="390" height="82" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="595" y="290" class="label" text-anchor="middle">S2 快照模块：校验文件</text>
<text x="595" y="319" class="label" text-anchor="middle">格式 / 路径 / 哈希 / 大小</text></g><g id="s3"><rect x="400" y="390" width="390" height="72" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="595" y="434" class="label" text-anchor="middle">S3 快照模块：建立内存表</text></g><g id="s4"><rect x="400" y="520" width="390" height="72" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="595" y="564" class="label" text-anchor="middle">S4 入口模块：绑定端口</text></g><g id="s5"><rect x="400" y="650" width="390" height="72" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="595" y="694" class="label" text-anchor="middle">S5 输出 READY，处理查询</text></g><g id="f1"><rect x="900" y="355" width="260" height="130" rx="14" fill="#fff0e8" stroke="#9eb5cb"/><text x="1030" y="400" class="label" text-anchor="middle">F1 记录失败原因</text>
<text x="1030" y="429" class="label" text-anchor="middle">关闭监听和句柄</text>
<text x="1030" y="458" class="label" text-anchor="middle">释放内存，失败退出</text></g><g id="w1"><rect x="40" y="335" width="275" height="150" rx="14" fill="#edf1f5" stroke="#9eb5cb"/><text x="177.5" y="376" class="label" text-anchor="middle">W1 外部监督超时</text>
<text x="177.5" y="405" class="label" text-anchor="middle">终止本次进程</text>
<text x="177.5" y="434" class="label" text-anchor="middle">等退出确认</text>
<text x="177.5" y="463" class="label" text-anchor="middle">未确认：阻塞</text></g><path d="M595 202 V255" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="710" y="237" class="note" text-anchor="middle">有效；设 5 s 期限</text><path d="M595 337 V390" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="710" y="369" class="note" text-anchor="middle">通过且未超时</text><path d="M595 462 V520" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="710" y="498" class="note" text-anchor="middle">成功且未超时</text><path d="M595 592 V650" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="710" y="628" class="note" text-anchor="middle">成功且未超时</text><path d="M790 166 H850 V420 H900" fill="none" stroke="#a06643" stroke-width="2.8" marker-end="url(#orange)"/><path d="M790 296 H850" fill="none" stroke="#a06643" stroke-width="2.8"/><path d="M790 426 H850" fill="none" stroke="#a06643" stroke-width="2.8"/><text x="1010" y="323" class="note" text-anchor="middle">失败 / 超时</text><path d="M790 556 H850 V420" fill="none" stroke="#a06643" stroke-width="2.8"/><path d="M380 130 H350 V592 H380 M315 410 H350" fill="none" stroke="#a06643" stroke-width="2.8" stroke-dasharray="7 5"/><text x="208" y="303" class="note" text-anchor="middle">虚线括号：监督 S1–S4</text>
<text x="40" y="796" class="note" text-anchor="start">蓝线：正常交接或执行顺序　棕实线：失败 / 退出；棕虚线：监督范围　文字说明条件，不以颜色代替语义</text>
<text x="40" y="827" class="note" text-anchor="start">S1–S5 共用冷启动 / 重启入口；W1 为独立监督，不是 F1 的后继步骤。</text>
</svg>
