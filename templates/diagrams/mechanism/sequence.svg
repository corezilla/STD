<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">03  正常交互时序</title>
<desc id="desc">CLI一次调用M，M校验准入后依次查询A和B，再返回Report；顺序与等待边界分开说明。</desc>
<defs>
<marker id="request-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#2563b4"/>
</marker>
<marker id="response-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
</marker>
<marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#7957a6"/>
</marker>
</defs>
<style>
text { font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#20334e; }
.title { font-size:34px; font-weight:650; } .meta { font-size:19px; fill:#62738a; }
.label { font-size:25px; font-weight:550; } .small { font-size:21px; fill:#4f617a; }
.panel { fill:#edf4fc; stroke:#9bb7d9; stroke-width:2; }
.accent { fill:#d6e7fb; stroke:#5f8ec8; stroke-width:2; }
.neutral { fill:#f0f3f6; stroke:#b4bfcd; stroke-width:2; }
.warning { fill:#fff3e3; stroke:#c89a58; stroke-width:2; }
.request { fill:none; stroke:#2563b4; stroke-width:3; }
.response { fill:none; stroke:#64748b; stroke-width:2.5; stroke-dasharray:8 6; }
.control { fill:none; stroke:#7957a6; stroke-width:2.5; stroke-dasharray:5 5; }
.lifeline { stroke:#c3cfdf; stroke-width:2; stroke-dasharray:5 6; }
</style>
<rect width="1440" height="840" fill="#fff"/>
<rect x="40" y="35" width="6" height="65" rx="3" fill="#3375c3"/>
<text class="title" x="64" y="65" text-anchor="start">
<tspan x="64" dy="0">03  正常交互时序</tspan>
</text>
<text class="meta" x="64" y="101" text-anchor="start">
<tspan x="64" dy="0">EX-OBS-01/v1 · 虚构教学 · Target / Planned / NOT_RUN · M + A/B 固定拓扑</tspan>
</text>
<g id="sequence-content">
<g id="cli">
<rect class="panel" x="50" y="165" width="200" height="70" rx="16"/>
<text class="label" x="150" y="208" text-anchor="middle">
<tspan x="150" dy="0">CLI</tspan>
</text>
</g>
<line class="lifeline" x1="150" y1="235" x2="150" y2="670"/>
<g id="m">
<rect class="accent" x="390" y="165" width="200" height="70" rx="16"/>
<text class="label" x="490" y="208" text-anchor="middle">
<tspan x="490" dy="0">M · 汇总</tspan>
</text>
</g>
<line class="lifeline" x1="490" y1="235" x2="490" y2="670"/>
<g id="a">
<rect class="panel" x="740" y="165" width="200" height="70" rx="16"/>
<text class="label" x="840" y="208" text-anchor="middle">
<tspan x="840" dy="0">目标 A</tspan>
</text>
</g>
<line class="lifeline" x1="840" y1="235" x2="840" y2="670"/>
<g id="b">
<rect class="panel" x="1130" y="165" width="200" height="70" rx="16"/>
<text class="label" x="1230" y="208" text-anchor="middle">
<tspan x="1230" dy="0">目标 B</tspan>
</text>
</g>
<line class="lifeline" x1="1230" y1="235" x2="1230" y2="670"/>
<path id="entry" class="request" d="M150 295H490" marker-end="url(#request-arrow)"/>
<text class="small" x="320" y="282" text-anchor="middle">
<tspan x="320" dy="0">① EX-OP1</tspan>
</text>
<text class="small" x="615" y="339" text-anchor="middle">
<tspan x="615" dy="0">校验 / 获得槽位 / 新轮次</tspan>
</text>
<path id="query-a" class="request" d="M490 390H840" marker-end="url(#request-arrow)"/>
<text class="small" x="665" y="377" text-anchor="middle">
<tspan x="665" dy="0">② EX-OP2 / A ≤ 700 ms</tspan>
</text>
<path id="a-return" class="response" d="M840 445H490" marker-end="url(#response-arrow)"/>
<text class="small" x="665" y="432" text-anchor="middle">
<tspan x="665" dy="0">③ Sample / 完整校验</tspan>
</text>
<path id="query-b" class="request" d="M490 520H1230" marker-end="url(#request-arrow)"/>
<text class="small" x="860" y="507" text-anchor="middle">
<tspan x="860" dy="0">④ EX-OP2 / B ≤ 700 ms</tspan>
</text>
<path id="b-return" class="response" d="M1230 575H490" marker-end="url(#response-arrow)"/>
<text class="small" x="860" y="562" text-anchor="middle">
<tspan x="860" dy="0">⑤ Sample / 完整校验</tspan>
</text>
<path id="report" class="response" d="M490 650H150" marker-end="url(#response-arrow)"/>
<text class="small" x="320" y="637" text-anchor="middle">
<tspan x="320" dy="0">⑥ HTTP 200 / COMPLETE</tspan>
</text>
<text class="small" x="150" y="680" text-anchor="middle">
<tspan x="150" dy="0">CLI 校验后退出 0</tspan>
</text>
<g id="deadlines">
<rect class="neutral" x="80" y="693" width="1280" height="50" rx="16"/>
<text class="label" x="720" y="726" text-anchor="middle">
<tspan x="720" dy="0">M 整轮收集预算 1500 ms；CLI 等待 2000 ms；无自动重试（教学 Specified，不是实测）</tspan>
</text>
</g>
</g>
<g id="legend">
<path d="M40 765H1400" stroke="#d9e2ed"/>
<text class="meta" x="45" y="800" text-anchor="start">
<tspan x="45" dy="0">图例：蓝实线 = 请求；灰虚线 = 响应；竖虚线 = 参与方生命线。纵向表示先后，不按时间比例。</tspan>
</text>
</g>
</svg>
