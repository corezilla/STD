<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">E2  条件分支与清理：只等待适用前置</title><desc id="desc">停止不依赖取证或收口；写入撤权不撤控制权限；选定分支完成才可释放。</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#326bad"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20334e}.title{font-size:34px;font-weight:650}.meta{font-size:19px;fill:#62738a}.label{font-size:25px;font-weight:550}.small{font-size:21px;fill:#4f617a}.panel{fill:#edf4fc;stroke:#9bb7d9;stroke-width:2}.accent{fill:#d6e7fb;stroke:#5f8ec8;stroke-width:2}.neutral{fill:#f0f3f6;stroke:#b4bfcd;stroke-width:2}.warning{fill:#fff3e3;stroke:#c89a58;stroke-width:2}.arrow{fill:none;stroke:#326bad;stroke-width:3}.conditional{fill:none;stroke:#326bad;stroke-width:3;stroke-dasharray:8 6}</style>
<rect width="1440" height="840" fill="#fff"/><rect x="40" y="35" width="6" height="65" rx="3" fill="#3375c3"/>
<text class="title" x="64" y="65" text-anchor="start"><tspan x="64" dy="0">E2  条件分支与清理：只等待适用前置</tspan></text>
<text class="meta" x="64" y="102" text-anchor="start"><tspan x="64" dy="0">EX-EXPORT-01/v1 · 虚构教学 · Target / Planned / NOT_RUN · EX-R2 / R3 / R5 / R6 / R7</tspan></text>
<g id="entry"><rect class="accent" x="470" y="140" width="500" height="70" rx="16"/><text class="label" x="720" y="183" text-anchor="middle"><tspan x="720" dy="0">正常执行 / 取消 / 响应丢失</tspan></text></g><path id="to-stop" class="arrow" d="M720 210V247" marker-end="url(#head)"/><g id="stop"><rect class="panel" x="470" y="251" width="500" height="83" rx="16"/><text class="label" x="720" y="284.5" text-anchor="middle"><tspan x="720" dy="0">stop：关闭 W 新写 + 排空在途</tspan><tspan x="720" dy="32">不等待 collect / finalize</tspan></text></g><text class="small" x="1180" y="292" text-anchor="middle"><tspan x="1180" dy="0">未证实排空</tspan><tspan x="1180" dy="32">留 STOPPING / HELD</tspan></text><path id="to-collect" class="arrow" d="M720 334V373" marker-end="url(#head)"/><g id="collect"><rect class="panel" x="470" y="377" width="500" height="83" rx="16"/><text class="label" x="720" y="410.5" text-anchor="middle"><tspan x="720" dy="0">collect：封结取证状态</tspan><tspan x="720" dy="32">CAPTURED / UNRECOVERABLE</tspan></text></g><path id="deliver-dependency" class="arrow" d="M565 460V482H335V513" marker-end="url(#head)"/><text class="small" x="238" y="473" text-anchor="middle"><tspan x="238" dy="0">选择交付且成功凭据齐全</tspan></text><path id="discard-dependency" class="arrow" d="M875 460V482H1095V513" marker-end="url(#head)"/><text class="small" x="1220" y="473" text-anchor="middle"><tspan x="1220" dy="0">选择取消 / 回退</tspan></text><g id="deliver"><rect class="panel" x="85" y="517" width="500" height="74" rx="16"/><text class="label" x="335" y="562" text-anchor="middle"><tspan x="335" dy="0">finalize(deliver)</tspan></text></g><g id="discard"><rect class="warning" x="845" y="517" width="500" height="74" rx="16"/><text class="label" x="1095" y="562" text-anchor="middle"><tspan x="1095" dy="0">finalize(discard)</tspan></text></g><path id="deliver-release" class="arrow" d="M335 591V628H575V657" marker-end="url(#head)"/><path id="discard-release" class="arrow" d="M1095 591V628H865V657" marker-end="url(#head)"/><text class="small" x="720" y="622" text-anchor="middle"><tspan x="720" dy="0">或：所选分支已完成</tspan></text><g id="release"><rect class="neutral" x="470" y="661" width="500" height="65" rx="16"/><text class="label" x="720" y="701.5" text-anchor="middle"><tspan x="720" dy="0">release：清理确认 → 归还本槽</tspan></text></g><text class="small" x="241" y="383" text-anchor="middle"><tspan x="241" dy="0">W 写权关闭后</tspan><tspan x="241" dy="32">C 控制调用仍可用</tspan><tspan x="241" dy="32">不得提前封死回退路径</tspan></text>
<g id="legend"><path d="M40 758H1400" stroke="#d9e2ed"/><text class="meta" x="48" y="791" text-anchor="start"><tspan x="48" dy="0">PENDING 不可收口；两分支并非都执行，不形成 stop ↔ collect 循环，不要求取消先交付。</tspan></text></g>
</svg>
