<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">02 使用场景：维护窗口的版本核对</title>
<desc id="desc">三个虚构场景分别展示 A、B 正常返回、B 超时以及无效命令时，维护人员的动作和可观察结果；本图不描述内部调用顺序。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563b4"/></marker>
</defs>
<style>
text { font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#20334e; }
.title { font-size:34px; font-weight:650; }
.meta { font-size:19px; fill:#62738a; }
.heading { font-size:23px; font-weight:650; }
.label { font-size:25px; font-weight:600; }
.small { font-size:21px; fill:#4f617a; }
.panel { fill:#edf4fc; stroke:#9bb7d9; stroke-width:2; }
.accent { fill:#d6e7fb; stroke:#5f8ec8; stroke-width:2; }
.neutral { fill:#f0f3f6; stroke:#b4bfcd; stroke-width:2; }
.request { fill:none; stroke:#2563b4; stroke-width:3; }
</style>
<rect width="1440" height="840" fill="#fff"/>
<rect x="40" y="35" width="6" height="65" rx="3" fill="#3375c3"/>
<text class="title" x="64" y="65">02  使用场景：维护窗口的版本核对</text>
<text class="meta" x="64" y="101">EX-OBS-01/v1 · 虚构教学 · Target / Planned / NOT_RUN · 固定目标 A、B</text>
<text class="heading" x="50" y="188">场景与条件</text>
<text class="heading" x="505" y="188">维护人员的动作</text>
<text class="heading" x="900" y="188">可观察结果</text>

<g id="complete-scenario">
<rect class="panel" x="50" y="210" width="375" height="130" rx="15"/>
<text class="label" x="72" y="253">SC-1 · 两个目标可访问</text>
<text class="small" x="72" y="295">维护前核对当前运行版本</text>
<rect class="accent" x="505" y="210" width="335" height="130" rx="15"/>
<text class="label" x="527" y="253">sys-inspect revisions</text>
<text class="small" x="527" y="295">授权身份 · 无目标参数</text>
<rect class="neutral" x="900" y="210" width="480" height="130" rx="15"/>
<text class="label" x="922" y="253">COMPLETE · 退出码 0</text>
<text class="small" x="922" y="295">Report 保留 A、B 的版本记录</text>
<path class="request" d="M425 275H497" marker-end="url(#arrow)"/>
<path class="request" d="M840 275H892" marker-end="url(#arrow)"/>
</g>

<g id="partial-scenario">
<rect class="panel" x="50" y="365" width="375" height="130" rx="15"/>
<text class="label" x="72" y="408">SC-2 · 目标 B 超时</text>
<text class="small" x="72" y="450">不能以旧缓存代替 B</text>
<rect class="accent" x="505" y="365" width="335" height="130" rx="15"/>
<text class="label" x="527" y="408">sys-inspect revisions</text>
<text class="small" x="527" y="450">同一入口 · 新观测轮次</text>
<rect class="neutral" x="900" y="365" width="480" height="130" rx="15"/>
<text class="label" x="922" y="408">PARTIAL · 退出码 2</text>
<text class="small" x="922" y="450">保留 A 的记录和 B 的错误</text>
<path class="request" d="M425 430H497" marker-end="url(#arrow)"/>
<path class="request" d="M840 430H892" marker-end="url(#arrow)"/>
</g>

<g id="rejected-scenario">
<rect class="panel" x="50" y="520" width="375" height="130" rx="15"/>
<text class="label" x="72" y="563">SC-3 · 命令参数非法</text>
<text class="small" x="72" y="605">调用尚未进入机制</text>
<rect class="accent" x="505" y="520" width="335" height="130" rx="15"/>
<text class="label" x="527" y="563">CLI 本地校验</text>
<text class="small" x="527" y="605">拒绝后不发 EX-OP1</text>
<rect class="neutral" x="900" y="520" width="480" height="130" rx="15"/>
<text class="label" x="922" y="563">INVALID_COMMAND · 64</text>
<text class="small" x="922" y="605">无 Report、无目标采样</text>
<path class="request" d="M425 585H497" marker-end="url(#arrow)"/>
<path class="request" d="M840 585H892" marker-end="url(#arrow)"/>
</g>

<text class="small" x="55" y="725">用途边界：只观察当前版本，不升级目标；A、B 的局部采样不构成同一时刻的全局快照。</text>
<g id="legend">
<line x1="40" y1="760" x2="1400" y2="760" stroke="#dde6f0" stroke-width="1"/>
<text class="meta" x="50" y="793">图例：每行是一种独立使用条件 → 用户动作 → 外部结果；箭头不表示内部调用顺序，内部时序见 §6。</text>
</g>
</svg>
