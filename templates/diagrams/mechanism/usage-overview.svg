<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">01  用途概览：何时使用，得到什么</title><desc id="desc">维护前核对目标版本，执行固定范围只读采样，输出逐目标结果。不是参与方职责图。</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#326bad"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20334e}.title{font-size:34px;font-weight:650}.meta{font-size:19px;fill:#62738a}.label{font-size:25px;font-weight:550}.small{font-size:21px;fill:#4f617a}.panel{fill:#edf4fc;stroke:#9bb7d9;stroke-width:2}.accent{fill:#d6e7fb;stroke:#5f8ec8;stroke-width:2}.neutral{fill:#f0f3f6;stroke:#b4bfcd;stroke-width:2}.warning{fill:#fff3e3;stroke:#c89a58;stroke-width:2}.arrow{fill:none;stroke:#326bad;stroke-width:3}.conditional{fill:none;stroke:#326bad;stroke-width:3;stroke-dasharray:8 6}</style>
<rect width="1440" height="840" fill="#fff"/><rect x="40" y="35" width="6" height="65" rx="3" fill="#3375c3"/>
<text class="title" x="64" y="65" text-anchor="start"><tspan x="64" dy="0">01  用途概览：何时使用，得到什么</tspan></text>
<text class="meta" x="64" y="102" text-anchor="start"><tspan x="64" dy="0">EX-OBS-01/v1 · 虚构教学 · Target / Planned / NOT_RUN</tspan></text>
<g id="scene"><rect class="panel" x="55" y="260" width="360" height="270" rx="16"/><text class="label" x="235" y="355" text-anchor="middle"><tspan x="235" dy="0">使用场景</tspan><tspan x="235" dy="32">维护或变更前</tspan><tspan x="235" dy="32">需要核对运行版本</tspan><tspan x="235" dy="32">避免只看安装包版本</tspan></text></g><g id="scope"><rect class="accent" x="540" y="260" width="360" height="270" rx="16"/><text class="label" x="720" y="355" text-anchor="middle"><tspan x="720" dy="0">处理范围</tspan><tspan x="720" dy="32">读取既定目标的运行版本</tspan><tspan x="720" dy="32">保留每个目标的成功/错误</tspan><tspan x="720" dy="32">不修改配置或执行升级</tspan></text></g><g id="outcome"><rect class="panel" x="1025" y="260" width="360" height="270" rx="16"/><text class="label" x="1205" y="355" text-anchor="middle"><tspan x="1205" dy="0">输出结果</tspan><tspan x="1205" dy="32">逐目标采样与错误</tspan><tspan x="1205" dy="32">完整 / 部分 / 无成功采样</tspan><tspan x="1205" dy="32">据此决定后续人工检查</tspan></text></g><path id="scene-to-scope" class="arrow" d="M415 395H535" marker-end="url(#head)"/><text class="small" x="478" y="369" text-anchor="middle"><tspan x="478" dy="0">发起查询</tspan></text><path id="scope-to-outcome" class="arrow" d="M900 395H1020" marker-end="url(#head)"/><text class="small" x="963" y="369" text-anchor="middle"><tspan x="963" dy="0">返回结果</tspan></text><text class="small" x="720" y="623" text-anchor="middle"><tspan x="720" dy="0">用途边界：当前观测，不是历史记录；局部采样不构成全局同一时刻快照。</tspan></text>
<g id="legend"><path d="M40 758H1400" stroke="#d9e2ed"/><text class="meta" x="48" y="791" text-anchor="start"><tspan x="48" dy="0">箭头表示使用任务的输入—处理—输出；运行参与方、接口和 authority 另见 §3。</tspan></text></g>
</svg>
