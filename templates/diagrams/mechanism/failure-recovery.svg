<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">05  部分结果与未知结果</title>
<desc id="desc">M存活时可返回部分Report；M在响应前退出则旧轮次结果未知；只读新查询不是重执行恢复。</desc>
<defs>
<marker id="request-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#2563b4"/>
</marker>
<marker id="response-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
</marker>
<marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#7957a6"/>
</marker>
</defs>
<style>
text { font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#20334e; }
.title { font-size:34px; font-weight:650; } .meta { font-size:19px; fill:#62738a; }
.label { font-size:25px; font-weight:550; } .small { font-size:21px; fill:#4f617a; }
.panel { fill:#edf4fc; stroke:#9bb7d9; stroke-width:2; }
.accent { fill:#d6e7fb; stroke:#5f8ec8; stroke-width:2; }
.neutral { fill:#f0f3f6; stroke:#b4bfcd; stroke-width:2; }
.warning { fill:#fff3e3; stroke:#c89a58; stroke-width:2; }
.request { fill:none; stroke:#2563b4; stroke-width:3; }
.response { fill:none; stroke:#64748b; stroke-width:2.5; stroke-dasharray:8 6; }
.control { fill:none; stroke:#7957a6; stroke-width:2.5; stroke-dasharray:5 5; }
.lifeline { stroke:#c3cfdf; stroke-width:2; stroke-dasharray:5 6; }
</style>
<rect width="1440" height="840" fill="#fff"/>
<rect x="40" y="35" width="6" height="65" rx="3" fill="#3375c3"/>
<text class="title" x="64" y="65" text-anchor="start">
<tspan x="64" dy="0">05  部分结果与未知结果</tspan>
</text>
<text class="meta" x="64" y="101" text-anchor="start">
<tspan x="64" dy="0">EX-OBS-01/v1 · 虚构教学 · Target / Planned / NOT_RUN · M + A/B 固定拓扑</tspan>
</text>
<g id="failure-content">
<g id="trigger">
<rect class="accent" x="450" y="170" width="540" height="80" rx="16"/>
<text class="label" x="720" y="218" text-anchor="middle">
<tspan x="720" dy="0">A 已采样；后续发生中断</tspan>
</text>
</g>
<path id="branch-left" class="request" d="M560 250V290H350V330" marker-end="url(#request-arrow)"/>
<path id="branch-right" class="request" d="M880 250V290H1090V330" marker-end="url(#request-arrow)"/>
<g id="partial">
<rect class="panel" x="90" y="330" width="530" height="150" rx="16"/>
<text class="label" x="355" y="383" text-anchor="middle">
<tspan x="355" dy="0">M 存活 / B 超时</tspan>
<tspan x="355" dy="30">A OK + B DEADLINE_EXCEEDED</tspan>
<tspan x="355" dy="30">PARTIAL Report / CLI 退出 2</tspan>
</text>
</g>
<g id="unknown">
<rect class="warning" x="825" y="330" width="530" height="150" rx="16"/>
<text class="label" x="1090" y="383" text-anchor="middle">
<tspan x="1090" dy="0">M 在响应前退出</tspan>
<tspan x="1090" dy="30">客户端只知通信错误</tspan>
<tspan x="1090" dy="30">旧轮次结果未知 / 无持久历史</tspan>
</text>
</g>
<path id="left-end" class="request" d="M355 480V555" marker-end="url(#request-arrow)"/>
<path id="right-end" class="request" d="M1090 480V555" marker-end="url(#request-arrow)"/>
<g id="left-clean">
<rect class="neutral" x="90" y="555" width="530" height="135" rx="16"/>
<text class="label" x="355" y="600.5" text-anchor="middle">
<tspan x="355" dy="0">结束本轮并清理</tspan>
<tspan x="355" dy="30">不以缓存补 B</tspan>
<tspan x="355" dy="30">不自动重试</tspan>
</text>
</g>
<g id="right-clean">
<rect class="neutral" x="825" y="555" width="530" height="135" rx="16"/>
<text class="label" x="1090" y="600.5" text-anchor="middle">
<tspan x="1090" dy="0">旧查询按资源期限清理</tspan>
<tspan x="1090" dy="30">获准的后续手动查询 = 新 ID</tspan>
<tspan x="1090" dy="30">不是恢复旧报告</tspan>
</text>
</g>
</g>
<g id="legend">
<path d="M40 765H1400" stroke="#d9e2ed"/>
<text class="meta" x="45" y="800" text-anchor="start">
<tspan x="45" dy="0">图例：蓝箭头 = 条件分支与处置。仅适用于无业务副作用、无跨请求资源预留的只读示例。</tspan>
</text>
</g>
</svg>
