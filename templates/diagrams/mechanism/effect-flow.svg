<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">E1  暂存导出：正常与响应丢失</title><desc id="desc">两分支均经过安全停止和取证，再交付或丢弃，释放依据所选分支终结。</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#326bad"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20334e}.title{font-size:34px;font-weight:650}.meta{font-size:19px;fill:#62738a}.label{font-size:25px;font-weight:550}.small{font-size:21px;fill:#4f617a}.panel{fill:#edf4fc;stroke:#9bb7d9;stroke-width:2}.accent{fill:#d6e7fb;stroke:#5f8ec8;stroke-width:2}.neutral{fill:#f0f3f6;stroke:#b4bfcd;stroke-width:2}.warning{fill:#fff3e3;stroke:#c89a58;stroke-width:2}.arrow{fill:none;stroke:#326bad;stroke-width:3}.conditional{fill:none;stroke:#326bad;stroke-width:3;stroke-dasharray:8 6}</style>
<rect width="1440" height="840" fill="#fff"/><rect x="40" y="35" width="6" height="65" rx="3" fill="#3375c3"/>
<text class="title" x="64" y="65" text-anchor="start"><tspan x="64" dy="0">E1  暂存导出：正常与响应丢失</tspan></text>
<text class="meta" x="64" y="102" text-anchor="start"><tspan x="64" dy="0">EX-EXPORT-01/v1 · 虚构教学 · Target / Planned / NOT_RUN · C → A（内部 W）</tspan></text>
<g id="prepare"><rect class="accent" x="435" y="142" width="570" height="70" rx="16"/><text class="label" x="720" y="185" text-anchor="middle"><tspan x="720" dy="0">prepare 预留 → execute 受理</tspan></text></g><path id="normal-branch" class="arrow" d="M575 212V238H335V266" marker-end="url(#head)"/><text class="small" x="260" y="225" text-anchor="middle"><tspan x="260" dy="0">确认成功，凭据可读</tspan></text><path id="lost-branch" class="arrow" d="M865 212V238H1095V266" marker-end="url(#head)"/><text class="small" x="1200" y="225" text-anchor="middle"><tspan x="1200" dy="0">响应与完成凭据丢失</tspan></text><g id="normal-stop"><rect class="panel" x="75" y="270" width="520" height="98" rx="16"/><text class="label" x="335" y="311" text-anchor="middle"><tspan x="335" dy="0">inspect 核对结果；stop</tspan><tspan x="335" dy="32">关闭写入并排空 → FENCED</tspan></text></g><g id="lost-stop"><rect class="warning" x="835" y="270" width="520" height="98" rx="16"/><text class="label" x="1095" y="311" text-anchor="middle"><tspan x="1095" dy="0">inspect 仍 UNKNOWN；stop</tspan><tspan x="1095" dy="32">关闭写入并排空 → FENCED</tspan></text></g><path id="normal-collect" class="arrow" d="M335 368V411" marker-end="url(#head)"/><path id="lost-collect" class="arrow" d="M1095 368V411" marker-end="url(#head)"/><g id="normal-evidence"><rect class="panel" x="75" y="415" width="520" height="96" rx="16"/><text class="label" x="335" y="455" text-anchor="middle"><tspan x="335" dy="0">collect → CAPTURED</tspan><tspan x="335" dy="32">finalize(deliver) → 返回完整结果</tspan></text></g><g id="lost-evidence"><rect class="warning" x="835" y="415" width="520" height="96" rx="16"/><text class="label" x="1095" y="455" text-anchor="middle"><tspan x="1095" dy="0">collect → UNRECOVERABLE</tspan><tspan x="1095" dy="32">finalize(discard) → 保留 UNKNOWN</tspan></text></g><path id="normal-release" class="arrow" d="M335 511V566H575V604" marker-end="url(#head)"/><path id="lost-release" class="arrow" d="M1095 511V566H865V604" marker-end="url(#head)"/><g id="release"><rect class="neutral" x="435" y="608" width="570" height="98" rx="16"/><text class="label" x="720" y="649" text-anchor="middle"><tspan x="720" dy="0">release → 槽归还；旧 ID 不再执行</tspan><tspan x="720" dy="32">新任务需显式请求 / 新 operation_id</tspan></text></g><text class="small" x="720" y="553" text-anchor="middle"><tspan x="720" dy="0">仅已选分支终结</tspan></text><text class="meta" x="720" y="730" text-anchor="middle"><tspan x="720" dy="0">安全未证明：留 STOPPING / HELD；取证未封结：不 finalize；清理失败：不开放槽位。</tspan></text>
<g id="legend"><path d="M40 758H1400" stroke="#d9e2ed"/><text class="meta" x="48" y="791" text-anchor="start"><tspan x="48" dy="0">箭头为带前提的步骤；规范唯一见案例 EX-R1～R8。响应超时不是旧执行已停的证明。</tspan></text></g>
</svg>
