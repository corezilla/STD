<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title description">
  <title id="title">FPGA 程序顶层架构</title>
  <desc id="description">图像采集卡自研 FPGA 逻辑的虚构教学示例。数据通路为输入解析、帧组装、帧队列、传输调度；控制与状态包含采集控制、配置寄存器、状态与错误统计；公共支撑包含复位与初始化、调试与自检。两端灰色框表示接口边界而非器件。不是 FPGA 芯片内部资源架构，也不是综合后的布局。箭头只表示主数据方向，控制、时钟、复位和背压细节省略。Target，Planned，NOT_RUN。</desc>
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#14263f; }
      .title { font-size:36px; font-weight:600; }
      .subtitle { font-size:21px; fill:#586e87; }
      .status { font-size:17px; fill:#586e87; text-anchor:end; }
      .section { font-size:22px; font-weight:500; fill:#4b6585; }
      .label { font-size:26px; font-weight:500; text-anchor:middle; }
      .boundary-label { font-size:23px; text-anchor:middle; }
      .panel { fill:#f1f6fc; stroke:#bacfe7; stroke-width:1.5; }
      .module { fill:#a8ccf4; stroke:#74a9e4; stroke-width:1.3; filter:url(#shadow); }
      .control { fill:#c4dcf7; stroke:#9bbde5; stroke-width:1.3; filter:url(#shadow); }
      .support { fill:#d8e4f1; stroke:#acbfd6; stroke-width:1.3; filter:url(#shadow); }
      .external { fill:#eef2f6; stroke:#b6c2d0; stroke-width:1.5; }
      .data { fill:none; stroke:#357dcc; stroke-width:3; marker-end:url(#arrow); }
      .footnote { font-size:19px; fill:#586e87; }
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#243f60" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#357dcc" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1440" height="860" fill="#fff"/>
  <text class="title" x="64" y="68">FPGA 程序顶层架构</text>
  <text class="subtitle" x="64" y="108">图像采集卡 · 自研逻辑模块</text>
  <text class="status" x="1376" y="66">教学示例 · Target / Planned</text>

  <g id="own-rtl">
    <rect class="panel" x="206" y="158" width="1028" height="562" rx="18"/>
    <text class="section" x="242" y="205">数据通路</text>
    <g id="input-parser" transform="translate(242 232)">
      <rect class="module" width="212" height="116" rx="12"/>
      <text class="label" x="106" y="67">输入解析</text>
    </g>
    <g id="frame-assembler" transform="translate(490 232)">
      <rect class="module" width="212" height="116" rx="12"/>
      <text class="label" x="106" y="67">帧组装</text>
    </g>
    <g id="frame-queue" transform="translate(738 232)">
      <rect class="module" width="212" height="116" rx="12"/>
      <text class="label" x="106" y="67">帧队列</text>
    </g>
    <g id="transfer-scheduler" transform="translate(986 232)">
      <rect class="module" width="212" height="116" rx="12"/>
      <text class="label" x="106" y="67">传输调度</text>
    </g>

    <text class="section" x="242" y="408">控制与状态</text>
    <g id="acquisition-controller" transform="translate(242 434)">
      <rect class="control" width="304" height="94" rx="12"/>
      <text class="label" x="152" y="57">采集控制</text>
    </g>
    <g id="configuration-registers" transform="translate(568 434)">
      <rect class="control" width="304" height="94" rx="12"/>
      <text class="label" x="152" y="57">配置寄存器</text>
    </g>
    <g id="status-error-counters" transform="translate(894 434)">
      <rect class="control" width="304" height="94" rx="12"/>
      <text class="label" x="152" y="57">状态与错误统计</text>
    </g>

    <text class="section" x="242" y="584">公共支撑</text>
    <g id="reset-initialization" transform="translate(242 610)">
      <rect class="support" width="466" height="78" rx="12"/>
      <text class="label" x="233" y="49">复位与初始化</text>
    </g>
    <g id="debug-self-test" transform="translate(732 610)">
      <rect class="support" width="466" height="78" rx="12"/>
      <text class="label" x="233" y="49">调试与自检</text>
    </g>
  </g>

  <g id="input-boundary">
    <rect class="external" x="32" y="240" width="140" height="100" rx="12"/>
    <text class="boundary-label" x="102" y="282"><tspan x="102">相机数据</tspan><tspan x="102" dy="32">输入</tspan></text>
  </g>
  <g id="output-boundary">
    <rect class="external" x="1268" y="240" width="140" height="100" rx="12"/>
    <text class="boundary-label" x="1338" y="282"><tspan x="1338">主机传输</tspan><tspan x="1338" dy="32">接口</tspan></text>
  </g>
  <g id="main-data-direction">
    <path class="data" d="M172 290 H237"/>
    <path class="data" d="M454 290 H485"/>
    <path class="data" d="M702 290 H733"/>
    <path class="data" d="M950 290 H981"/>
    <path class="data" d="M1198 290 H1263"/>
  </g>
  <text class="footnote" x="206" y="772">方框表示我们设计的逻辑模块，不表示 FPGA 芯片资源或物理布局。</text>
  <text class="footnote" x="206" y="808">箭头仅示主数据方向；接口实现、控制关系与时钟复位另图展开。</text>
</svg>
