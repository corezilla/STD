<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">作业处理子系统 · 第 0 层整体架构</title>
<desc id="desc">与上下文相同 S02；入口、任务编排、执行对接为功能分区；公共配置横向服务前三者。分区不是模块或进程。</desc>
<defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20344b}.title{font-size:28px;font-weight:650}.label{font-size:23px;font-weight:600}.note{font-size:17px;fill:#53667b}.id{font-size:16px;font-weight:400}.business{fill:none;stroke:#287bc1;stroke-width:3}.control{fill:none;stroke:#8264ab;stroke-width:3;stroke-dasharray:8 5}</style><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#287bc1"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8264ab"/></marker></defs>
<rect width="1200" height="720" rx="18" fill="white"/>
<text x="36" y="48" class="title">作业处理子系统 · 第 0 层整体架构</text><text x="36" y="80" class="note">EX-JOB/v2 · Target / Planned / NOT_RUN · 虚构教学示例</text>
<g data-object-id="S02" data-object-type="subsystem" data-parent-id="SW-P"><rect x="265" y="115" width="670" height="490" rx="18" fill="#fafcff" stroke="#8faac7" stroke-width="2"/><text x="285" y="146" class="note">S02 子系统边界</text>
<g data-group-id="entry"><rect x="310" y="175" width="340" height="84" rx="12" fill="#e0edf9" stroke="#acc0d5"/><text x="480" y="225" text-anchor="middle" class="label">入口</text></g>
<g data-group-id="orchestration"><rect x="310" y="316" width="340" height="84" rx="12" fill="#d6e3f3" stroke="#acc0d5"/><text x="480" y="366" text-anchor="middle" class="label">任务编排</text></g>
<g data-group-id="execution"><rect x="310" y="457" width="340" height="84" rx="12" fill="#dfe8ee" stroke="#acc0d5"/><text x="480" y="507" text-anchor="middle" class="label">执行对接</text></g>
<g data-group-id="shared"><rect x="750" y="275" width="150" height="165" rx="12" fill="#eee7f7" stroke="#acc0d5"/><text x="825" y="365.5" text-anchor="middle" class="label">公共配置</text></g>
<line x1="480" y1="259" x2="480" y2="316" class="business" marker-end="url(#blue)" marker-start="url(#blue)"/>
<text x="496" y="296" class="note">合法任务 / 状态</text>
<line x1="480" y1="400" x2="480" y2="457" class="business" marker-end="url(#blue)" marker-start="url(#blue)"/>
<text x="496" y="437" class="note">执行 / 完成</text>
<path d="M750 300 H704 V217 H650" class="control" marker-end="url(#purple)"/>
<line x1="750" y1="355" x2="650" y2="355" class="control" marker-end="url(#purple)"/>
<path d="M750 411 H704 V499 H650" class="control" marker-end="url(#purple)"/>
<text x="685" y="570" class="note">固定版本配置 → 三个分区</text>
</g><g data-external-id="CALLER"><rect x="30" y="175" width="175" height="84" rx="12" fill="#edf1f5" stroke="#acc0d5"/><text x="117.5" y="225" text-anchor="middle" class="label">业务调用方</text></g>
<line x1="205" y1="217" x2="310" y2="217" class="business" marker-end="url(#blue)" marker-start="url(#blue)"/>
<g data-external-id="ADMIN"><rect x="985" y="275" width="185" height="84" rx="12" fill="#f0eaf8" stroke="#acc0d5"/><text x="1077.5" y="325" text-anchor="middle" class="label">管理客户端</text></g>
<line x1="985" y1="317" x2="900" y2="317" class="control" marker-end="url(#purple)" marker-start="url(#purple)"/>
<g data-external-id="EXEC"><rect x="30" y="457" width="175" height="84" rx="12" fill="#edf1f5" stroke="#acc0d5"/><text x="117.5" y="507" text-anchor="middle" class="label">执行服务</text></g>
<line x1="310" y1="499" x2="205" y2="499" class="business" marker-end="url(#blue)" marker-start="url(#blue)"/>
<line x1="40" y1="642" x2="104" y2="642" class="business" marker-end="url(#blue)" marker-start="url(#blue)"/>
<text x="118" y="648" class="note">业务请求/响应（双向）</text>
<line x1="430" y1="642" x2="494" y2="642" class="control" marker-end="url(#purple)"/>
