<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
 <title id="title">FrameView 借用与输入寿命</title><desc id="desc">Caller 持有输入，decode_one 只读借用；成功时返回借用视图，Caller 消费视图之后才能修改或释放输入；其他结果无视图且输入不变。</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#4676a8"/></marker></defs>
 <style>text{font-family:system-ui,'PingFang SC',sans-serif;fill:#20344b}.head{font-size:22px;font-weight:600}.body{font-size:17px}.note{font-size:15px;fill:#54708b}.edge{fill:none;stroke:#4676a8;stroke-width:3;marker-end:url(#arrow)}</style>
 <rect width="1120" height="350" fill="#fff"/><text x="32" y="40" class="head">EX-ISD/v1 · 借用视图的寿命</text>
 <rect x="32" y="92" width="215" height="82" rx="12" fill="#e9f2fb" stroke="#8eabc8" stroke-width="2"/><text x="139" y="140" text-anchor="middle" class="body">Caller 持有输入存储</text>
 <rect x="325" y="92" width="215" height="82" rx="12" fill="#dceafb" stroke="#8eabc8" stroke-width="2"/><text x="432" y="140" text-anchor="middle" class="body">decode_one 只读借用</text>
 <rect x="630" y="72" width="215" height="82" rx="12" fill="#e6f4ed" stroke="#8ab8a0" stroke-width="2"/><text x="737" y="120" text-anchor="middle" class="body">OK：FrameView 借用输入</text>
 <rect x="900" y="72" width="190" height="82" rx="12" fill="#e6f4ed" stroke="#8ab8a0" stroke-width="2"/><text x="995" y="108" text-anchor="middle" class="body">先消费 view</text><text x="995" y="133" text-anchor="middle" class="note">再改写或释放输入</text>
 <rect x="630" y="210" width="460" height="82" rx="12" fill="#f2f6fa" stroke="#aab9c7" stroke-width="2"/><text x="860" y="247" text-anchor="middle" class="body">NEED_MORE / INVALID：不返回 view</text><text x="860" y="272" text-anchor="middle" class="note">输入保持不变</text>
 <path class="edge" d="M247 133 H325"/><path class="edge" d="M540 120 H630"/><path class="edge" d="M845 113 H900"/><path class="edge" d="M540 145 C585 145 585 251 630 251"/>
 <text x="32" y="326" class="note">返回结果与所有权规则必须与函数定义及验证向量一致。</text>
</svg>
