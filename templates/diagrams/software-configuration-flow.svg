<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">配置生效 · 明确选择重启生效，而非热切换</title><desc id="desc">本例允许切换停机；不自动回退目录。旧进程退出前不宣称新配置生效。</desc>
<defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20344b}.heading{font-size:30px;font-weight:650}.label{font-size:22px;font-weight:550}.note{font-size:18px;fill:#53667b}</style>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#287bc1"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a06643"/></marker></defs>
<rect width="1200" height="780" rx="18" fill="white"/>
<text x="40" y="48" class="heading" text-anchor="start">配置生效 · 明确选择重启生效，而非热切换</text>
<text x="40" y="83" class="note" text-anchor="start">EX-SEARCH/v1 · Target / Planned / NOT_RUN · 虚构教学</text>
<g id="c1"><rect x="70" y="160" width="340" height="90" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="240" y="199" class="label" text-anchor="middle">C1 部署者</text>
<text x="240" y="228" class="label" text-anchor="middle">检查新的路径与地址参数</text></g><g id="c2"><rect x="70" y="340" width="340" height="90" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="240" y="379" class="label" text-anchor="middle">C2 部署者</text>
<text x="240" y="408" class="label" text-anchor="middle">按 P-STOP 停止旧进程</text></g><g id="c3"><rect x="70" y="525" width="340" height="90" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="240" y="564" class="label" text-anchor="middle">C3 部署者</text>
<text x="240" y="593" class="label" text-anchor="middle">以新参数执行 P-START</text></g><g id="bad"><rect x="820" y="145" width="310" height="100" rx="14" fill="#fff0e8" stroke="#9eb5cb"/><text x="975" y="189" class="label" text-anchor="middle">参数检查失败</text>
<text x="975" y="218" class="label" text-anchor="middle">保留旧服务；不进入停止</text></g><g id="wait"><rect x="820" y="330" width="310" height="105" rx="14" fill="#fff0e8" stroke="#9eb5cb"/><text x="975" y="376.5" class="label" text-anchor="middle">未确认旧进程退出</text>
<text x="975" y="405.5" class="label" text-anchor="middle">保持阻塞；不启动第二份</text></g><g id="down"><rect x="820" y="515" width="310" height="105" rx="14" fill="#fff0e8" stroke="#9eb5cb"/><text x="975" y="561.5" class="label" text-anchor="middle">新启动失败</text>
<text x="975" y="590.5" class="label" text-anchor="middle">服务不可用；修复后重试</text></g><g id="ready"><rect x="460" y="635" width="280" height="62" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="600" y="674" class="label" text-anchor="middle">C4 新进程 READY</text></g><path d="M240 250 V340" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="318" y="300" class="note" text-anchor="middle">参数有效</text><path d="M240 430 V525" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="320" y="481" class="note" text-anchor="middle">确认退出</text><path d="M410 590 H600 V635" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="493" y="622" class="note" text-anchor="middle">新启动成功</text><path d="M410 205 H820" fill="none" stroke="#a06643" stroke-width="2.8" marker-end="url(#orange)"/><text x="615" y="187" class="note" text-anchor="middle">参数非法</text><path d="M410 385 H820" fill="none" stroke="#a06643" stroke-width="2.8" marker-end="url(#orange)"/><text x="615" y="367" class="note" text-anchor="middle">停止未确认</text><path d="M410 545 H820" fill="none" stroke="#a06643" stroke-width="2.8" marker-end="url(#orange)"/><text x="615" y="527" class="note" text-anchor="middle">检查 / 绑定失败</text>
<text x="40" y="726" class="note" text-anchor="start">蓝线：正常交接或执行顺序　棕线：失败 / 退出　文字说明条件，不以颜色代替语义</text>
<text x="40" y="757" class="note" text-anchor="start">本例允许切换停机；不自动回退目录。旧进程退出前不宣称新配置生效。</text>
</svg>
