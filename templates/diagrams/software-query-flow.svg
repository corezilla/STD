<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">业务处理 · 一次只读查询怎样取得结果</title><desc id="desc">无持久任务；发送完成不证明客户端收到，不把重连描述为恢复旧执行。</desc>
<defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20344b}.heading{font-size:30px;font-weight:650}.label{font-size:22px;font-weight:550}.note{font-size:18px;fill:#53667b}</style>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#287bc1"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a06643"/></marker></defs>
<rect width="1200" height="800" rx="18" fill="white"/>
<text x="40" y="48" class="heading" text-anchor="start">业务处理 · 一次只读查询怎样取得结果</text>
<text x="40" y="83" class="note" text-anchor="start">EX-SEARCH/v1 · Target / Planned / NOT_RUN · 虚构教学</text>
<g id="q1"><rect x="65" y="160" width="300" height="90" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="215" y="199" class="label" text-anchor="middle">Q1 入口模块</text>
<text x="215" y="228" class="label" text-anchor="middle">校验查询与就绪状态</text></g><g id="q2"><rect x="450" y="160" width="300" height="90" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="600" y="199" class="label" text-anchor="middle">Q2 查询处理</text>
<text x="600" y="228" class="label" text-anchor="middle">取得当前内存表引用</text></g><g id="q3"><rect x="450" y="355" width="300" height="90" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="600" y="394" class="label" text-anchor="middle">Q3 查询处理</text>
<text x="600" y="423" class="label" text-anchor="middle">检索并形成结果</text></g><g id="q4"><rect x="65" y="355" width="300" height="90" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="215" y="394" class="label" text-anchor="middle">Q4 入口模块</text>
<text x="215" y="423" class="label" text-anchor="middle">向客户端发送结果</text></g><g id="q5"><rect x="65" y="570" width="300" height="80" rx="14" fill="#dceafb" stroke="#9eb5cb"/><text x="215" y="618" class="label" text-anchor="middle">Q5 释放本请求临时对象</text></g><g id="reject"><rect x="870" y="145" width="270" height="105" rx="14" fill="#fff0e8" stroke="#9eb5cb"/><text x="1005" y="191.5" class="label" text-anchor="middle">非法查询 / 未就绪</text>
<text x="1005" y="220.5" class="label" text-anchor="middle">拒绝；不开始检索</text></g><g id="failed"><rect x="870" y="355" width="270" height="135" rx="14" fill="#fff0e8" stroke="#9eb5cb"/><text x="1005" y="402.5" class="label" text-anchor="middle">检索失败 / 请求中断</text>
<text x="1005" y="431.5" class="label" text-anchor="middle">停止本请求计算</text>
<text x="1005" y="460.5" class="label" text-anchor="middle">转入共同清理 Q5</text></g><path d="M365 205 H450" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="406" y="187" class="note" text-anchor="middle">通过</text><path d="M600 250 V355" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="690" y="309" class="note" text-anchor="middle">同一 generation</text><path d="M450 400 H365" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="407" y="382" class="note" text-anchor="middle">结果</text><path d="M215 445 V570" fill="none" stroke="#287bc1" stroke-width="2.8" marker-end="url(#blue)"/><text x="315" y="510" class="note" text-anchor="middle">已发送 / 连接断开</text><path d="M215 160 V115 H1005 V145" fill="none" stroke="#a06643" stroke-width="2.8" marker-end="url(#orange)"/><text x="600" y="109" class="note" text-anchor="middle">校验拒绝</text><path d="M750 400 H870" fill="none" stroke="#a06643" stroke-width="2.8" marker-end="url(#orange)"/><text x="810" y="382" class="note" text-anchor="middle">失败</text><path d="M1005 490 V610 H365" fill="none" stroke="#a06643" stroke-width="2.8" marker-end="url(#orange)"/><text x="740" y="592" class="note" text-anchor="middle">本请求结束，不撤销其他请求</text>
<text x="40" y="746" class="note" text-anchor="start">蓝线：正常交接或执行顺序　棕线：失败 / 退出　文字说明条件，不以颜色代替语义</text>
<text x="40" y="777" class="note" text-anchor="start">无持久任务；发送完成不证明客户端收到，不把重连描述为恢复旧执行。</text>
